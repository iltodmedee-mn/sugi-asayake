packages:
  - '.'
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
# 2026-09-20 (PHASE 6): `patchedDependencies: wouter@3.7.1` энд байсан. Тэр patch
# нь `<Switch>`-ийн route замуудыг `window.__WOUTER_ROUTES__`-д цуглуулдаг байсан
# бөгөөд Manus preview-ийн үлдэгдэл — repo даяар (код, тест, e2e, script, HTML)
# тэр глобалыг УНШДАГ газар нэг ч байхгүй байв. Устгаснаар wouter нь upstream-ийн
# өөрийн хувилбараар суудаг болно.
# 2026-09-09 deep audit: transitive-dependency overrides live in package.json's
# "pnpm.overrides" key. pnpm 10.4.1 prints "no longer read" for that key but
# demonstrably applies it (the overrides land in pnpm-lock.yaml's
# `overrides:` block and the resolved graph changes), whereas overrides
# declared HERE were verified on 2026-09-06 to be silently ignored by this
# exact pnpm version (pnpm/pnpm#10614, #10675). Keep them in ONE place until
# the pinned pnpm version is upgraded; then move them here and delete the
# package.json key. Ranges are bounded to the dependent's own major on
# purpose -- an unbounded ">=1.20.8" once pulled body-parser 2 and
# path-to-regexp 8 under express 4.

# 2026-11-07: package.json-ийн "pnpm.overrides"-ийн ХУУЛБАР. pnpm 10.x-ийн шинэ хувилбарууд (лаптоп дээрх)
# package.json-ийн `pnpm` талбарыг уншихаа больсон ("no longer read" анхааруулга) тул энд ч байна;
# packageManager-ийн pnpm 10.4.1 package.json-ийг уншина. Хоёр нь ИЖИЛ байх ёстой — server/pnpm-config-guard.test.ts.
overrides:
  "qs": ">=6.16.0 <7"
  "body-parser@1": ">=1.20.8 <2"
  "path-to-regexp@0.1": ">=0.1.13 <0.2"
  "lodash": ">=4.18.1 <5"
  "postcss": ">=8.5.28 <9"
  "nanoid@3": ">=3.3.18 <4"
  "uuid@8": ">=11.1.1 <12"
  "tar": ">=7.5.22 <8"
  "picomatch@4": ">=4.0.7 <5"
  "browserslist": ">=4.29.0 <5"
  "baseline-browser-mapping": ">=2.11.24 <3"
  "rollup": ">=4.63.3 <5"
  "sharp": ">=0.35.4 <0.36"
  "adm-zip": ">=0.6.1 <0.7"
  "esbuild": ">=0.25.10 <0.29"
  "@babel/core": ">=7.29.6 <8"
  "brace-expansion@1": ">=1.1.21 <2"
  "brace-expansion@2": ">=2.1.7 <3"
